[package]
name = "oxic"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Oxi compiler"

[dependencies]
anyhow = "1.0.103"
colored = "3.1.1"
regex = "1.12.4"
inkwell = { version = "0.9.0", features = ["llvm21-1"] }
clap = { version = "4.6.1", features = ["derive"] }
parking_lot = "0.12.5"
rand = "0.8.6"
thin-vec = "0.2.18"

oxic_diag = { path = "crates/oxic_diag" }

[dev-dependencies]
cargo-husky = { version = "1.5.0", default-features = false, features = ["user-hooks"] }

oxic_test = { path = "crates/oxic_test" }

[build-dependencies]
cc = "1.2.65"

[lib]
name = "oxic"
path = "src/main.rs"

