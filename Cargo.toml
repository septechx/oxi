[package]
name = "oxic"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Oxi compiler"

[dependencies]
anyhow = "1.0.102"
colored = "3.1.1"
regex = "1.12.3"
inkwell = { version = "0.9.0", features = ["llvm21-1"] }
clap = { version = "4.6.1", features = ["derive"] }
parking_lot = "0.12.5"
rand = "0.8.6"
thin-vec = "0.2.18"

[dev-dependencies]
husky-rs = "0.3.3"

[build-dependencies]
cc = "1.2.62"

[lib]
name = "oxic"
path = "src/main.rs"

