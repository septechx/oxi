message = "Cannot import a path with only 1 segment"

[import_private_item]
level = "Error"
message = "Cannot import a private item"

[failed_to_resolve_path]
level = "Error"
message = "Failed to resolve path"

[failed_to_resolve_in_module]
level = "Error"
