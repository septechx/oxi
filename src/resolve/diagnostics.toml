[module_file_read_error]
level = "Error"
message = "Failed to read module file `{file}`: {error}"

[module_tokenize_error]
level = "Error"
message = "Failed to tokenize module file `{file}`"

[module_parse_error]
level = "Error"
message = "Failed to parse module file `{file}`"

[duplicate_module_declaration]
